version: "3.8"

services:
  tiktok-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok-bot
    restart: unless-stopped
    ports:
      - "8080:80"      # UI (Nginx → Vue)
      - "8000:8000"    # API (FastAPI)
    env_file:
      - .env
    volumes:
      - tiktok_data:/app/data
      - tiktok_reports:/app/reports
      - tiktok_logs:/app/logs
    shm_size: "2gb"    # Chromium / Playwright 需要
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  tiktok_data:
  tiktok_reports:
  tiktok_logs:
